[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geodesic"
version = "0.1.0"
description = "Traceable literature discovery and scientific evidence organization toolkit (local, single researcher)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pydantic>=2.6",
    "httpx>=0.27",
    "pypdf>=5.0",
    "defusedxml>=0.7.1",
    "PyYAML>=6.0",
    "streamlit>=1.40",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pillow>=10"]   # pillow: reading back PNG figures in tests

[project.scripts]
geodesic = "geodesic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geodesic = ["templates/*.yaml", "templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that contact live external services (deselected by default; run with -m network)",
    "scale: synthetic scale smoke test (~10k papers / ~100k findings; deselected by default; run with -m scale)",
]
addopts = "-m 'not network and not scale' -q"
filterwarnings = ["ignore::DeprecationWarning"]
